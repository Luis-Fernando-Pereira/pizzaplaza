name: Product Service CI

on:
  push:
    paths:
      - 'product-service/**'

  pull_request:
    paths:
      - 'product-service/**'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compilar
        run: mvn clean verify
        working-directory: product-service

      - name: Build Docker
        run: |
          docker build \
            -t pizzaplaza-product-service \
            ./product-service
