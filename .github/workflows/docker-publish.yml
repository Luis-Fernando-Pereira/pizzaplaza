name: Docker Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter-java.outputs.changes }}
      app-front: ${{ steps.filter-front.outputs.app-front }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter-java
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
              - 'libraries/**'
              - 'pom.xml'
            user-service:
              - 'user-service/**'
              - 'libraries/**'
              - 'pom.xml'
            product-service:
              - 'product-service/**'
              - 'libraries/**'
              - 'pom.xml'
            order-service:
              - 'order-service/**'
              - 'libraries/**'
              - 'pom.xml'
            api-gateway:
              - 'api-gateway/**'
              - 'pom.xml'

      - uses: dorny/paths-filter@v3
        id: filter-front
        with:
          filters: |
            app-front:
              - 'app-front/**'

  test-java:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e testar ${{ matrix.service }}
        run: mvn clean verify -pl ${{ matrix.service }} -am

  test-front:
    needs: detect-changes
    if: needs.detect-changes.outputs.app-front == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-front/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: app-front

      - name: Testar
        run: npm test -- --watch=false
        working-directory: app-front

  publish-java:
    needs: [detect-changes, test-java]
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pizzaplaza-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build e push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-front:
    needs: [detect-changes, test-front]
    if: needs.detect-changes.outputs.app-front == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pizzaplaza-app-front
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build e push app-front
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=$(echo "$TAGS" | sed 's/^/--tag /' | tr '\n' ' ')
          docker buildx build \
            --cache-from "type=gha,scope=app-front" \
            --cache-to "type=gha,mode=max,scope=app-front" \
            --file app-front/Dockerfile \
            $TAG_ARGS \
            --push \
            ./app-front
