name: Frontend CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-front/**'
  pull_request:
    paths:
      - 'app-front/**'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-front/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: app-front

      - name: Build
        run: npm run build
        working-directory: app-front
