# Configuração do SonarQube — projeto único cobrindo backend (Java/Quarkus
# multimódulo) + frontend (Angular). Analisado pelo SonarScanner CLI a partir
# da raiz do repositório.
#
# Pré-requisitos antes de escanear:
#   1. mvn clean verify          -> gera target/classes e os jacoco.xml
#   2. (em app-front) npm test -- --watch=false  -> gera coverage/app-front/lcov.info
#   3. ajustar os caminhos do lcov para a raiz do repo:
#        sed -i 's|^SF:|SF:app-front/|' app-front/coverage/app-front/lcov.info
#
# Execução:
#   sonar-scanner -Dsonar.token=<TOKEN>

sonar.projectKey=pizzaplaza
sonar.projectName=PizzaPlaza
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# ---- Fontes de produção (Java + Angular) ----
sonar.sources=\
  auth-service/src/main/java,\
  user-service/src/main/java,\
  product-service/src/main/java,\
  order-service/src/main/java,\
  api-gateway/src/main/java,\
  libraries/entity/src/main/java,\
  libraries/util/src/main/java,\
  app-front/src

# ---- Código de teste Java ----
sonar.tests=\
  product-service/src/test/java,\
  order-service/src/test/java

# ---- Análise Java ----
sonar.java.source=21
sonar.java.binaries=**/target/classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# ---- Análise Frontend (TypeScript) ----
sonar.javascript.lcov.reportPaths=app-front/coverage/app-front/lcov.info

# ---- Exclusões ----
# Specs do Angular entram só como cobertura (lcov), não como código analisado.
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/*.spec.ts
sonar.coverage.exclusions=**/dtos/**,**/entities/**,**/*.spec.ts
