quarkus.http.port=8080

quarkus.swagger-ui.always-include=true

# URLs dos microserviços - dev (local)
quarkus.rest-client.auth-service.url=http://localhost:8082
quarkus.rest-client.product-service.url=http://localhost:8083
quarkus.rest-client.order-service.url=http://localhost:8084
quarkus.rest-client.user-service.url=http://localhost:8081

# URLs dos microserviços - prod (Docker)
%prod.quarkus.rest-client.auth-service.url=http://auth-service:8082
%prod.quarkus.rest-client.product-service.url=http://product-service:8083
%prod.quarkus.rest-client.order-service.url=http://order-service:8084
%prod.quarkus.rest-client.user-service.url=http://user-service:8081

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true
