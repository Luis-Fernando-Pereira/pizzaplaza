<div class="page-header">
  <div>
    <h1 class="page-title">Editar Administrador</h1>
    <p style="color:var(--color-text-muted);font-size:var(--text-sm);margin-top:var(--space-1)">Atualize os dados do administrador</p>
  </div>
  <a class="btn btn-ghost" routerLink="/admin/admins">← Voltar</a>
</div>

@if (loading()) {
  <div class="card" style="padding:var(--space-10);text-align:center;color:var(--color-text-muted)">
    Carregando...
  </div>
} @else if (admin()) {
  <app-admin-form [admin]="admin()" />
} @else {
  <div class="card" style="padding:var(--space-10);text-align:center;color:var(--color-text-muted)">
    Administrador não encontrado.
  </div>
}
