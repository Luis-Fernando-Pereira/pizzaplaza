<form class="admin-form card" [formGroup]="form" (ngSubmit)="save()">

  <div class="form-group">
    <label class="form-label" for="description">Nome da categoria</label>
    <input
      id="description"
      type="text"
      class="form-input"
      formControlName="description"
      placeholder="Ex: Salgada, Doce, Especial"
    />
    @if (form.controls.description.invalid && form.controls.description.touched) {
      <span class="form-error">Descrição obrigatória</span>
    }
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">
      @if (form.value.oid) { Atualizar } @else { Salvar }
    </button>
  </div>

</form>
