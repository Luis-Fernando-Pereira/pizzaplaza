<div class="page-header">

  <div>
    <h1>Categorias</h1>
    <p>Gerencie as categorias da pizzaria</p>
  </div>

  <a class="new-button" routerLink="/admin/categorias/novo">
    Nova Categoria
  </a>

</div>

<div class="table-container">

  <table>

    <thead>

    <tr>
      <th>Nome</th>
      <th>Ações</th>
    </tr>

    </thead>

    <tbody>

      @for (category of categories(); track category.oid) {

        <tr>

          <td>
            {{ category.description }}
          </td>

          <td class="actions">

            <a
              class="edit-button"
              [routerLink]="['/admin/categories', category.oid, 'editar']">

              Editar

            </a>

            <button
              class="delete-button"
              (click)="deleteCategory(category.oid!)">

              Excluir

            </button>

          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
