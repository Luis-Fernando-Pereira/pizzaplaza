<div class="page-header">
  <div>
    <h1 class="page-title">Editar Categoria</h1>
    <p style="color:var(--color-text-muted);font-size:var(--text-sm);margin-top:var(--space-1)">Atualize os dados da categoria</p>
  </div>
  <a class="btn btn-ghost" routerLink="/admin/categories">← Voltar</a>
</div>

@if (loading()) {
  <p style="color:var(--color-text-muted)">Carregando...</p>
} @else {
  <app-category-form [category]="category()"></app-category-form>
}
