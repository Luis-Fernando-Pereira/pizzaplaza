<aside class="sidebar" [class.collapsed]="layout.collapsed()">

  <div class="sidebar-top">
    @if (!layout.collapsed()) {
      <a routerLink="/admin" class="sidebar-logo">Pizza Plaza</a>
    }
    <button class="sidebar-toggle" (click)="layout.toggleMenu()" title="Recolher menu">
      @if (layout.collapsed()) { → } @else { ← }
    </button>
  </div>

  <nav class="sidebar-nav">

    <a routerLink="/admin/flavors" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🍕</span>
      @if (!layout.collapsed()) { <span>Sabores</span> }
    </a>

    <a routerLink="/admin/categories" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🏷️</span>
      @if (!layout.collapsed()) { <span>Categorias</span> }
    </a>

    <a routerLink="/admin/orders" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">📦</span>
      @if (!layout.collapsed()) { <span>Pedidos</span> }
    </a>

    <a routerLink="/admin/admins" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">👤</span>
      @if (!layout.collapsed()) { <span>Administradores</span> }
    </a>

  </nav>

  <div class="sidebar-bottom">
    <button class="nav-item logout-item" (click)="auth.logout()">
      <span class="nav-icon">🚪</span>
      @if (!layout.collapsed()) { <span>Sair</span> }
    </button>
  </div>

</aside>
