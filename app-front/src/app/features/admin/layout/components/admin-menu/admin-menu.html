<aside class="sidebar"
       [class.collapsed]="layout.collapsed()">

  <div class="top-area">

    @if (!layout.collapsed()) {
      <div class="logo">
        🍕 Pizza Plaza
      </div>
    }

    <button class="toggle-btn"
            (click)="layout.toggleMenu()">
      ☰
    </button>

  </div>

  <nav class="menu">

    <a routerLink="/admin/flavors" routerLinkActive="active">
      <span class="icon">🍕</span>
      @if (!layout.collapsed()) {
        <span>Sabores</span>
      }
    </a>

    <a routerLink="/admin/categories" routerLinkActive="active">

      <span class="icon">🔥</span>

      @if (!layout.collapsed()) {
        <span>Categorias</span>
      }

    </a>

    <a routerLink="/admin/orders"
       routerLinkActive="active">

      <span class="icon">📦</span>

      @if (!layout.collapsed()) {
        <span>Pedidos</span>
      }

    </a>

  </nav>

</aside>
