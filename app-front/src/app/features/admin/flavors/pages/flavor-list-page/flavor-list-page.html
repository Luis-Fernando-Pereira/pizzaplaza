<div class="page-header">
  <div>
    <h1 class="page-title">Sabores</h1>
    <p style="color:var(--color-text-muted);font-size:var(--text-sm);margin-top:var(--space-1)">Gerencie os sabores cadastrados</p>
  </div>
  <a class="btn btn-primary" routerLink="/admin/flavors/new">+ Novo sabor</a>
</div>

<div class="table-wrapper animate-fade-in-up">
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Preço</th>
        <th style="text-align:right">Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (flavor of flavors(); track flavor.oid) {
        <tr class="table-row-actions">
          <td><strong>{{ flavor.name }}</strong></td>
          <td style="color:var(--color-text-muted);max-width:300px">{{ flavor.description }}</td>
          <td><span class="price-badge">R$ {{ flavor.price.toFixed(2) }}</span></td>
          <td>
            <div class="row-actions">
              <a class="btn btn-ghost btn-sm" [routerLink]="['/admin/flavors', flavor.oid]">Editar</a>
              <button class="btn btn-sm" style="background:#FDECEA;color:var(--color-brand);border:none;cursor:pointer" (click)="deleteFlavor(flavor.oid!)">Excluir</button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
