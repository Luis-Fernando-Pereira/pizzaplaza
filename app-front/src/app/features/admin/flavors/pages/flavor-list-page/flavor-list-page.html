<div class="page-header">

  <div>

    <h1>Sabores</h1>

    <p>
      Gerencie os sabores cadastrados
    </p>

  </div>

  <a class="new-button" routerLink="/admin/sabores/novo">Novo sabor</a>

</div>

<div class="table-container">

  <table>

    <thead>

    <tr>
      <th>Nome</th>
      <th>Descrição</th>
      <th>Preço</th>
      <th>Ações</th>
    </tr>

    </thead>

    <tbody>

      @for (flavor of flavors(); track flavor.oid) {

        <tr>

          <td>
            {{ flavor.name }}
          </td>

          <td>
            {{ flavor.description }}
          </td>

          <td>
            R$ {{ flavor.price.toFixed(2) }}
          </td>

          <td class="actions">

            <a class="edit-button" [routerLink]="['/admin/sabores', flavor.oid, 'editar']">Editar</a>

            <button class="delete-button" (click)="deleteFlavor(flavor.oid!)">Excluir</button>

          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
