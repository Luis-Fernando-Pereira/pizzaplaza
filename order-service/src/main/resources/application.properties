quarkus.http.port=8084

quarkus.swagger-ui.always-include=true

mp.jwt.verify.issuer=auth-service
%dev.mp.jwt.verify.publickey.location=../auth/publicKey.pem
%prod.mp.jwt.verify.publickey.location=/publicKey.pem

#Data source
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=fernando
quarkus.datasource.password=fernando
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pizzaplaza_db
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/pizzaplaza_db
quarkus.hibernate-orm.database.default-schema=order_service

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm.active=true
quarkus.hibernate-orm.packages=br.com.pizzaplaza.orderservice.entities

%dev.quarkus.rest-client.product-service.url=http://localhost:8083
%prod.quarkus.rest-client.product-service.url=http://product-service:8083

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true
